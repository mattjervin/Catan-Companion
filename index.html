  const out = []; const q0 = c - r \u002F 2;\n    for (let dq = -depth; dq <= depth; dq++) for (let dr = -depth; dr <= depth; dr++) {\n      const ds = -dq - dr;\n      if (Math.abs(dq) + Math.abs(dr) + Math.abs(ds) > depth * 2) continue;\n      const rr = r + dr; out.push([rr, (q0 + dq) + rr \u002F 2]);\n    }\n    return out;\n  }\n\n  hexDist(a, b) {\n    const q1 = a[1] - a[0] \u002F 2, q2 = b[1] - b[0] \u002F 2;\n    const dq = q1 - q2, dr = a[0] - b[0], ds = -dq - dr;\n    return (Math.abs(dq) + Math.abs(dr) + Math.abs(ds)) \u002F 2;\n  }\n\n  \u002F\u002F Free-form island layout: clusters of 2–3 hexes floating one or two sea hexes\n  \u002F\u002F off the mainland, never touching each other. Total hex count stays official.\n  randomIsles(cfg, seed) {\n    const n = cfg.isles.length;\n    const main = cfg.main;\n    const kk = c => c[0] + '|' + c[1];\n    const dToMain = c => { let m = 99; for (const x of main) { const d = this.hexDist(c, x); if (d < m) m = d; } return m; };\n\n    let r0 = 1e9, r1 = -1e9, q0 = 1e9, q1 = -1e9;\n    main.forEach(c => {\n      r0 = Math.min(r0, c[0]); r1 = Math.max(r1, c[0]);\n      const q = c[1] - c[0] \u002F 2; q0 = Math.min(q0, q); q1 = Math.max(q1, q);\n    });\n    const band = [], bandKeys = new Set();\n    for (let r = r0 - 4; r <= r1 + 4; r++) for (let q = q0 - 4; q <= q1 + 4; q++) {\n      const c = [r, q + r \u002F 2], d = dToMain(c);\n      if (d >= 2 && d <= 3) { band.push(c); bandKeys.add(kk(c)); }\n    }\n\n    for (let attempt = 0; attempt < 60; attempt++) {\n      const rnd = this.rng(seed + attempt * 104729);\n      const pool = this.shuffled(band, rnd);\n      const chosen = [];\n      for (const start of pool) {\n        if (chosen.length >= n) break;\n        if (chosen.some(c => this.hexDist(c, start) < 2)) continue;\n        const remaining = n - chosen.length;\n        let size = Math.min(remaining, 2 + Math.floor(rnd() * 2));\n        if (remaining - size === 1) size = Math.min(remaining, size + 1);\n        const cl = [start];\n        while (cl.length < size) {\n          const cands = [];\n          cl.forEach(c => this.neighbors(c[0], c[1]).forEach(nb => {\n            if (!bandKeys.has(kk(nb))) return;\n            if (cl.some(x => kk(x) === kk(nb))) return;\n            if (chosen.some(x => this.hexDist(x, nb) < 2)) return;\n            cands.push(nb);\n          }));\n          if (!cands.length) break;\n          cl.push(cands[Math.floor(rnd() * cands.length)]);\n        }\n        if (cl.length >= 2 || remaining === 1) cl.forEach(c => chosen.push(c));\n      }\n      if (chosen.length === n) return chosen;\n    }\n    return cfg.isles;\n  }\n\n  activeIsles(cfg) {\n    if (!cfg.isles) return [];\n    return this.state.randomIsles ? this.randomIsles(cfg, this.state.iSeed) : cfg.isles;\n  }\n\n  clusters(cells) {\n    const kk = c => c[0] + '|' + c[1];\n    const left = cells.slice(), out = [];\n    while (left.length) {\n      const cl = [left.shift()];\n      let grew = true;\n      while (grew) {\n        grew = false;\n        for (let i = left.length - 1; i >= 0; i--) {\n          if (cl.some(c => this.neighbors(c[0], c[1]).some(nb => kk(nb) === kk(left[i])))) {\n            cl.push(left.splice(i, 1)[0]); grew = true;\n          }\n        }\n      }\n      out.push(cl);\n    }\n    return out;\n  }\n\n  hexPoints(x, y) {\n    const R = this.R, p = [];\n    for (let k = 0; k < 6; k++) { const a = Math.PI \u002F 180 * (60 * k - 90); p.push((x + R * Math.cos(a)).toFixed(1) + ',' + (y + R * Math.sin(a)).toFixed(1)); }\n    return p.join(' ');\n  }\n\n  deal(cfg, land) {\n    const key = (r, c) => r + '|' + c;\n    cfg = Object.assign({}, cfg, { land });\n    const isRed = n => n === 6 || n === 8;\n    const bag = [];\n    Object.keys(cfg.terrain).forEach(k => { for (let i = 0; i < cfg.terrain[k]; i++) bag.push(k); });\n\n    \u002F\u002F terrain depends only on tSeed, so re-rolling numbers leaves the map alone\n    const terrain = {};\n    const rand = this.rng(this.state.tSeed);\n    const mainCells = cfg.main || cfg.land;\n    const mainKeys = new Set(mainCells.map(c => key(c[0], c[1])));\n    const islandCells = cfg.land.filter(c => !mainKeys.has(key(c[0], c[1])));\n\n    if (!islandCells.length) {\n      const t = this.shuffled(bag, rand);\n      cfg.land.forEach((cell, i) => { terrain[key(cell[0], cell[1])] = t[i]; });\n    } else {\n      \u002F\u002F Heading for New Shores draws the mainland and the small islands from separate\n      \u002F\u002F pools: the desert (robber start) stays on the mainland, the gold is island terrain.\n      const pool = this.shuffled(bag, rand);\n      const take = kind => { const i = pool.indexOf(kind); return i < 0 ? null : pool.splice(i, 1)[0]; };\n      const mainBag = [], islandBag = [];\n      let d; while ((d = take('desert')) && mainBag.length < mainCells.length) mainBag.push(d);\n      let g; while (islandBag.length < islandCells.length && (g = take('gold'))) islandBag.push(g);\n      while (islandBag.length < islandCells.length) islandBag.push(pool.pop());\n      while (mainBag.length < mainCells.length) mainBag.push(pool.pop());\n      const mb = this.shuffled(mainBag, rand), ib = this.shuffled(islandBag, rand);\n      mainCells.forEach((cell, i) => { terrain[key(cell[0], cell[1])] = mb[i]; });\n      islandCells.forEach((cell, i) => { terrain[key(cell[0], cell[1])] = ib[i]; });\n    }\n\n    const numberedCells = cfg.land.filter(cell => terrain[key(cell[0], cell[1])] !== 'desert');\n    \u002F\u002F Rejection sampling. The 37-hex hexagon is dense enough that only ~0.4% of\n    \u002F\u002F shuffles keep every red apart, so 300 tries silently gave up a third of the\n    \u002F\u002F time there; the loop breaks on the first success, so small boards pay nothing.\n    const attempts = this.state.balanced ? 4000 : 1;\n    let numbers = null;\n    for (let a = 0; a < attempts; a++) {\n      const nums = this.shuffled(cfg.numbers, this.rng(this.state.nSeed + a * 7919));\n      const cand = {};\n      numberedCells.forEach((cell, i) => { cand[key(cell[0], cell[1])] = nums[i]; });\n      if (!this.state.balanced) { numbers = cand; break; }\n      let ok = true;\n      for (const cell of numberedCells) {\n        if (!isRed(cand[key(cell[0], cell[1])])) continue;\n        for (const nb of this.neighbors(cell[0], cell[1])) {\n          if (isRed(cand[key(nb[0], nb[1])])) { ok = false; break; }\n        }\n        if (!ok) break;\n      }\n      if (ok || a === attempts - 1) { numbers = cand; break; }\n    }\n    return { terrain, numbers };\n  }\n\n  board() {\n    const cfg = this.cfg()[this.boardKey()];\n    const R = this.R, W = Math.sqrt(3) * R, VS = 1.5 * R;\n    const key = (r, c) => r + '|' + c;\n    const isles = this.activeIsles(cfg);\n    const land = cfg.isles ? cfg.main.concat(isles) : cfg.land;\n    const isleKeys = new Set(isles.map(c => key(c[0], c[1])));\n    const landSet = new Set(land.map(c => key(c[0], c[1])));\n    const mainArr = cfg.main || cfg.land;\n    const mainSet = new Set(mainArr.map(c => key(c[0], c[1])));\n\n    const seaMap = new Map();\n    land.forEach(cell => this.ringCells(cell[0], cell[1], cfg.depth).forEach(s => {\n      const kk = key(s[0], s[1]);\n      if (!landSet.has(kk) && !seaMap.has(kk)) seaMap.set(kk, s);\n    }));\n    const sea = Array.from(seaMap.values());\n    \u002F\u002F The rendered ocean runs cfg.depth rings out so Seafarers has open water to sail\n    \u002F\u002F through, but only the water touching land is a tile you actually have to lay —\n    \u002F\u002F that is the count the setup panel quotes.\n    const coast = new Set();\n    land.forEach(cell => this.ringCells(cell[0], cell[1], 1).forEach(w => {\n      const kk = key(w[0], w[1]);\n      if (!landSet.has(kk)) coast.add(kk);\n    }));\n    const seaTiles = coast.size;\n\n    let cx = 0, cy = 0;\n    mainArr.forEach(c => { cx += c[1] * W; cy += c[0] * VS; });\n    cx \u002F= mainArr.length; cy \u002F= mainArr.length;\n    const cands = sea.filter(s => this.neighbors(s[0], s[1]).some(n => mainSet.has(key(n[0], n[1]))))\n      .map(s => ({ r: s[0], c: s[1], ang: Math.atan2(s[0] * VS - cy, s[1] * W - cx) }))\n      .sort((a, b) => a.ang - b.ang);\n    \u002F\u002F Harbor slots stay evenly spaced around the coast (like the real board) but the\n    \u002F\u002F rotational start and the type-to-slot assignment both key off hSeed, so re-rolling\n    \u002F\u002F moves every harbor — generic and resource — to a fresh position each time.\n    const hRand = this.rng(this.state.hSeed);\n    const rotOffset = cands.length ? Math.floor(hRand() * cands.length) : 0;\n    const harborTypes = this.shuffled(cfg.harbors, this.rng(this.state.hSeed + 104729));\n    const harborCells = []; const used = new Set();\n    for (let i = 0; i < harborTypes.length; i++) {\n      let idx = (rotOffset + Math.round(i * cands.length \u002F harborTypes.length)) % cands.length;\n      let guard = 0;\n      while (used.has(idx) && guard++ < cands.length) idx = (idx + 1) % cands.length;\n      used.add(idx);\n      if (cands[idx]) harborCells.push({ cell: cands[idx], type: harborTypes[i] });\n    }\n\n    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;\n    land.concat(sea).forEach(c => {\n      const x = c[1] * W, y = c[0] * VS;\n      minX = Math.min(minX, x - W \u002F 2); maxX = Math.max(maxX, x + W \u002F 2);\n      minY = Math.min(minY, y - R); maxY = Math.max(maxY, y + R);\n    });\n    const pad = R * 0.7, ox = -minX + pad, oy = -minY + pad;\n    const vw = (maxX - minX) + pad * 2, vh = (maxY - minY) + pad * 2;\n\n    const { terrain, numbers } = this.deal(cfg, land);\n    const show = this.state.showNumbers;\n\n    \u002F\u002F stable per-hex codes (A1, A2, B1…) so a fogged tile on the board maps to a card below\n    const isleCodes = {};\n    this.clusters(isles).forEach((cl, gi) => {\n      const letter = String.fromCharCode(65 + gi);\n      cl.slice().sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]))\n        .forEach((c, i) => { isleCodes[key(c[0], c[1])] = letter + (i + 1); });\n    });\n\n    const pct = v => (v \u002F vw * 100);\n    const landHexes = [], tokens = [], mysteries = [];\n    land.forEach(cell => {\n      const x = cell[1] * W + ox, y = cell[0] * VS + oy;\n      const k = key(cell[0], cell[1]);\n      const kind = terrain[k];\n      const n = numbers[k];\n      const isGold = kind === 'gold';\n      const hidden = this.state.hideIslands && isleKeys.has(k) && !this.state.revealed[k];\n      if (hidden) {\n        landHexes.push({ points: this.hexPoints(x, y), fill: 'var(--s1)', stroke: 'rgba(var(--acc-rgb),.35)', sw: '2.5' });\n        mysteries.push({\n          left: pct(x).toFixed(2), top: (y \u002F vh * 100).toFixed(2),\n          size: pct(R * 0.94).toFixed(2), fs: pct(R * 0.46).toFixed(2),\n          code: isleCodes[k] || '?'\n        });\n        return;\n      }\n      landHexes.push({\n        points: this.hexPoints(x, y),\n        fill: this.colors[kind].fill,\n        stroke: isGold ? 'rgba(var(--acc-rgb),.85)' : 'rgba(7,10,18,.55)',\n        sw: isGold ? '4' : '2'\n      });\n      if (show && n) {\n        const red = n === 6 || n === 8;\n        tokens.push({\n          left: pct(x).toFixed(2),\n          top: (y \u002F vh * 100).toFixed(2),\n          size: pct(R * 0.94).toFixed(2),\n          fs: pct(R * 0.52).toFixed(2),\n          pipFs: pct(R * 0.2).toFixed(2),\n          pipGap: pct(R * 0.05).toFixed(2),\n          value: String(n),\n          pips: this.pipsFor(n),\n          color: red ? 'var(--danger)' : '#0b1120'\n        });\n      }\n    });\n\n    const seaHexes = sea.map(c => ({ points: this.hexPoints(c[1] * W + ox, c[0] * VS + oy) }));\n\n    const harbors = harborCells.map(h => {\n      const x = h.cell.c * W + ox, y = h.cell.r * VS + oy;\n      const generic = h.type === '3:1';\n      const resource = generic ? null : h.type.split(':')[1];\n      return {\n        left: pct(x).toFixed(2), top: (y \u002F vh * 100).toFixed(2),\n        size: pct(R * 1.1).toFixed(2), fs: pct(R * 0.3).toFixed(2), subFs: pct(R * 0.22).toFixed(2),\n        fill: generic ? 'var(--acc)' : this.colors[resource].fill,\n        label: generic ? '3:1' : '2:1',\n        sub: generic ? '' : this.harborAbbr[resource]\n      };\n    });\n\n    return { cfg, landHexes, seaHexes, harbors, tokens, mysteries, isles, terrain, numbers, isleCodes, seaTiles,\n             viewBox: '0 0 ' + vw.toFixed(0) + ' ' + vh.toFixed(0) };\n  }\n\n  pipsFor(n) {\n    const map = { 2: '•', 12: '•', 3: '••', 11: '••', 4: '•••', 10: '•••', 5: '••••', 9: '••••', 6: '•••••', 8: '•••••' };\n    return map[n] || '';\n  }\n\n  tog(on, label, hint, toggle) {\n    return {\n      label, hint, toggle,\n      cardBg: on ? 'rgba(var(--acc-rgb),.08)' : 'rgba(255,255,255,.025)',\n      cardBd: on ? 'rgba(var(--acc-rgb),.4)' : 'var(--hair)',\n      trackBg: on ? 'var(--acc)' : 'rgba(255,255,255,.1)',\n      trackBd: on ? 'var(--acc)' : 'var(--b2)',\n      knobX: on ? '21px' : '2px',\n      knobBg: on ? 'var(--bg)' : 'var(--t3)',\n      labelColor: on ? 'var(--acc)' : 'var(--t3)'\n    };\n  }\n\n  opt(active, label, pick) {\n    return { label, pick, cls: active ? 'choice-pill selected' : 'choice-pill' };\n  }\n\n  \u002F\u002F Card-count reference, independent of the board's dealt terrain\u002Fnumbers — resource\n  \u002F\u002F cards aren’t included since a surplus there never breaks a game the way a short\n  \u002F\u002F development\u002Fprogress deck does.\n  devDeck(s) {\n    const p56 = s.players === '56';\n    const p78 = s.players === '78';\n    if (s.ck) {\n      return {\n        heading: 'Progress cards · Cities & Knights · ' + (p78 ? '7–8' : p56 ? '5–6' : '3–4') + ' players',\n        total: 54,\n        rows: [\n          { color: 'var(--amber)', name: 'Politics', note: 'yellow deck', count: 18 },\n          { color: 'var(--lime)', name: 'Trade', note: 'green deck', count: 18 },\n          { color: 'var(--blue)', name: 'Science', note: 'blue deck', count: 18 }\n        ],\n        note: p78\n          ? 'The progress deck stays at 54 no matter how many are playing — extensions add commodity cards, knights and city walls, never more progress cards. Eight players needs a second Cities & Knights set for the extra knights, city walls and commodity stacks, but keep one 54-card progress deck and one improvement track per player.'\n          : 'Same 54-card spread at every player count — the 5–6 Player Extension adds commodity cards, knights, and city walls, not more progress cards. These replace the base development deck entirely; also set out 18 Commodity cards (paper · cloth · coin) and, at 5–6 players, 3 Defender of Catan VP cards.'\n      };\n    }\n    if (p78) {\n      return {\n        heading: 'Development cards · 7–8 players',\n        total: 43,\n        rows: [\n          { color: 'var(--danger)', name: 'Knight', note: 'move the robber', count: 26 },\n          { color: 'var(--acc)', name: 'Victory Point', note: 'keep hidden', count: 5 },\n          { color: 'var(--blue)', name: 'Road Building', note: '2 free roads', count: 4 },\n          { color: 'var(--amber)', name: 'Year of Plenty', note: 'any 2 from the bank', count: 4 },\n          { color: 'var(--purple)', name: 'Monopoly', note: 'name a resource', count: 4 }\n        ],\n        note: 'Take the 34-card 5–6 deck and add 6 Knight, 1 Road Building, 1 Year of Plenty and 1 Monopoly from the second base set — leaving that set’s Victory Point cards in the box, because 5 is still the right number however many are playing. This matches the 43-card deck Colonist deals in its 7–8 player mode.'\n      };\n    }\n    if (p56) {\n      return {\n        heading: 'Development cards · 5–6 players',\n        total: 34,\n        rows: [\n          { color: 'var(--danger)', name: 'Knight', note: 'move the robber', count: 20 },\n          { color: 'var(--acc)', name: 'Victory Point', note: 'keep hidden', count: 5 },\n          { color: 'var(--blue)', name: 'Road Building', note: '2 free roads', count: 3 },\n          { color: 'var(--amber)', name: 'Year of Plenty', note: 'any 2 from the bank', count: 3 },\n          { color: 'var(--purple)', name: 'Monopoly', note: 'name a resource', count: 3 }\n        ],\n        note: 'The base 25-card deck plus the 9 the 5–6 Player Extension adds: 6 Knight, 1 Road Building, 1 Year of Plenty, 1 Monopoly. Seafarers uses this same deck — it doesn’t bring its own.'\n      };\n    }\n    return {\n      heading: 'Development cards · 3–4 players',\n      total: 25,\n      rows: [\n        { color: 'var(--danger)', name: 'Knight', note: 'move the robber', count: 14 },\n        { color: 'var(--acc)', name: 'Victory Point', note: 'keep hidden', count: 5 },\n        { color: 'var(--blue)', name: 'Road Building', note: '2 free roads', count: 2 },\n        { color: 'var(--amber)', name: 'Year of Plenty', note: 'any 2 from the bank', count: 2 },\n        { color: 'var(--purple)', name: 'Monopoly', note: 'name a resource', count: 2 }\n      ],\n      note: 'Standard base-game deck. Seafarers uses this same deck — it doesn’t bring its own.'\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const b = this.board();\n    const meta = b.cfg;\n    const isSea = s.game === 'sea';\n\n    const terrainOrder = ['wood', 'wheat', 'sheep', 'brick', 'ore', 'gold', 'desert'];\n    const terrainRows = terrainOrder.filter(t => meta.terrain[t]).map(t => ({\n      color: this.swatch(t), name: this.colors[t].name, note: this.colors[t].note, count: meta.terrain[t]\n    }));\n\n    const counts = {};\n    meta.numbers.forEach(n => { counts[n] = (counts[n] || 0) + 1; });\n    const tokenChips = Object.keys(counts).map(Number).sort((x, y) => x - y).map(v => ({\n      value: v, times: '\\u00d7' + counts[v], pips: this.pipsFor(v),\n      color: (v === 6 || v === 8) ? 'var(--danger)' : '#0b1120'\n    }));\n\n    const gen = meta.harbors.filter(h => h === '3:1').length;\n    const resOrder = ['wood', 'brick', 'sheep', 'wheat', 'ore'];\n    const resCounts = {};\n    meta.harbors.forEach(h => { if (h !== '3:1') { const r = h.split(':')[1]; resCounts[r] = (resCounts[r] || 0) + 1; } });\n    const harborBreakdown = resOrder.filter(r => resCounts[r]).map(r => ({\n      color: this.swatch(r), name: this.colors[r].name.split(' — ')[1] || this.colors[r].name,\n      count: resCounts[r]\n    }));\n    const vp = (s.ck && !isSea) ? (s.players === '78' ? 15 : 13) : meta.vp;\n\n    \u002F\u002F How much water this board eats: the coastal sea hexes plus one token per harbor.\n    \u002F\u002F Seafarers layouts scatter, so this moves with every re-roll of the islands.\n    const seaTiles = b.seaTiles;\n    const waterTotal = seaTiles + meta.harbors.length;\n    const waterNote = seaTiles + ' sea tiles ringing the land \\u00b7 ' + meta.harbors.length + ' harbor tokens'\n      + (isSea ? ' \\u2014 free-form island layouts change the sea count, so read it after you scatter.'\n               : ' \\u2014 fixed for this board.');\n\n    const kOf = c => c[0] + '|' + c[1];\n    const islandGroups = this.clusters(b.isles).map((cl, gi) => {\n      const hexes = cl.slice().sort((a, x) => (a[0] - x[0]) || (a[1] - x[1]));\n      const openCount = hexes.filter(c => !s.hideIslands || s.revealed[kOf(c)]).length;\n      return {\n        label: 'Island ' + String.fromCharCode(65 + gi),\n        badge: openCount + '\u002F' + hexes.length,\n        hexes: hexes.map(c => {\n          const k = kOf(c);\n          const kind = b.terrain[k], n = b.numbers[k];\n          const open = !s.hideIslands || !!s.revealed[k];\n          return {\n            code: b.isleCodes[k] || '?',\n            codeBg: open ? 'rgba(255,255,255,.06)' : 'var(--acc-s)',\n            codeColor: open ? 'var(--t4)' : 'var(--acc)',\n            rowBd: open ? 'var(--hair)' : 'rgba(var(--acc-rgb),.35)',\n            color: open ? this.swatch(kind) : 'var(--s3)',\n            name: open ? this.colors[kind].name.split(' — ')[0] : 'Undiscovered',\n            resource: open ? (this.colors[kind].name.split(' — ')[1] || this.colors[kind].note) : 'tap to discover',\n            num: open ? (n ? String(n) : '—') : '?',\n            numColor: open ? ((n === 6 || n === 8) ? 'var(--danger)' : '#0b1120') : 'var(--t4)',\n            numBg: open ? 'var(--t0)' : 'rgba(255,255,255,.06)',\n            reveal: () => this.setState(p => {\n              const r = Object.assign({}, p.revealed); r[k] = true; return { revealed: r };\n            })\n          };\n        })\n      };\n    });\n    const revealedCount = b.isles.filter(c => s.revealed[kOf(c)]).length;\n\n    const devDeck = this.devDeck(s);\n    const p56 = s.players === '56';\n    const p78 = s.players === '78';\n    const bigGame = p56 || p78;\n    \u002F\u002F The Rules-refresher card always describes the base development deck, even with\n    \u002F\u002F C&K on (where it is replaced) \\u2014 so read it off a ck-free copy of the counts.\n    const baseDev = this.devDeck({ players: s.players, ck: false });\n    const devMix = baseDev.rows.map(r => r.count + ' ' + r.name).join(' \\u00b7 ') + '.';\n\n    const toggles = [\n      this.tog(s.balanced, 'Balanced numbers', s.balanced ? 'No two reds adjacent' : 'Anything goes',\n        () => this.setState(p => ({ balanced: !p.balanced }))),\n      this.tog(s.showNumbers, 'Show numbers', s.showNumbers ? 'Tokens on the board' : 'Terrain only',\n        () => this.setState(p => ({ showNumbers: !p.showNumbers })))\n    ];\n    if (isSea) {\n      toggles.push(this.tog(s.randomIsles, 'Random islands', s.randomIsles ? 'Free-form scatter' : 'Scenario layout',\n        () => this.setState(p => ({ randomIsles: !p.randomIsles, revealed: {} }))));\n      toggles.push(this.tog(s.hideIslands, 'Fog of war', s.hideIslands ? 'Islands hidden until found' : 'Everything face up',\n        () => this.setState(p => ({ hideIslands: !p.hideIslands, revealed: {} }))));\n    }\n\n    const statRow = [\n      { value: meta.land.length, label: 'Land hexes' },\n      { value: meta.numbers.length, label: 'Tokens' },\n      { value: vp, label: 'VP to win', hero: true },\n      { value: meta.harbors.length, label: 'Harbors' },\n      { value: isSea ? b.isles.length : meta.terrain.desert, label: isSea ? 'Island hexes' : 'Deserts' }\n    ];\n\n    return {\n      playerOpts: [\n        this.opt(s.players === '4', '3–4', () => this.setState({ players: '4' })),\n        this.opt(s.players === '56', '5–6', () => this.setState({ players: '56' })),\n        this.opt(s.players === '78', '7–8', () => this.setState({ players: '78', revealed: {} }))\n      ],\n      gameOpts: [\n        this.opt(s.game === 'base', 'Catan', () => this.setState({ game: 'base' })),\n        this.opt(s.game === 'sea', 'Seafarers', () => this.setState({ game: 'sea' }))\n      ],\n      ckOpts: [\n        this.opt(!s.ck, 'Off', () => this.setState({ ck: false })),\n        this.opt(s.ck, 'On', () => this.setState({ ck: true }))\n      ],\n      statRow, toggles,\n      configLabel: (isSea ? 'SEAFARERS' : 'CATAN') + ' · ' + (s.players === '4' ? '3–4P' : s.players === '56' ? '5–6P' : '7–8P') + (s.ck ? ' · C&K' : ''),\n      ckOn: s.ck, isSea,\n      kicker: meta.kicker, title: meta.title, subtitle: meta.subtitle,\n      rulesKicker: (isSea ? 'Seafarers builds on every base rule.' : 'Base game essentials.') + (s.ck ? ' Cities & Knights changes are in the Knights section.' : ''),\n      landTotal: meta.land.length,\n      seaTiles, waterTotal, waterNote,\n      numTotal: meta.numbers.length,\n      harborTotal: meta.harbors.length,\n      vpTarget: vp,\n      viewBox: b.viewBox, landHexes: b.landHexes, seaHexes: b.seaHexes, harbors: b.harbors, tokens: b.tokens,\n      mysteries: b.mysteries,\n      islandGroups,\n      discoverStatus: s.hideIslands\n        ? (revealedCount + ' of ' + b.isles.length + ' island hexes discovered.')\n        : 'Islands are face up — turn on Fog of war to hide them.',\n      terrainRows, tokenChips,\n      tokenNote: meta.tokenNote, harborNote: meta.harborNote,\n      genericHarbors: gen, specificHarbors: meta.harbors.length - gen, harborBreakdown,\n      devDeck, devMix, devTotal: baseDev.total,\n      p56, p78, bigGame, p56only: p56,\n      bigTitle: p78 ? 'Seven & eight players' : 'Five & six players',\n      bigNav: p78 ? '7\\u20138 Players' : '5\\u20136 Players',\n      bigPairBadge: p78 ? 'house scaling' : 'current rule',\n      p56Kicker: p78\n        ? 'Seven and eight is not an official CATAN configuration \\u2014 this is our build. The island grows one whole ring, the turn stays paired so nobody waits through seven other people, and the VP line moves up because a 37-hex island hands out points faster than a 19-hex one.' + (isSea ? ' Seafarers rides along unchanged apart from the bigger archipelago.' : '') + (s.ck ? ' Cities & Knights at this size needs a second box \\u2014 see below.' : '')\n        : 'The 5\\u20136 Player Extension does more than widen the island \\u2014 it rewrites the turn so nobody sits idle for five other players. Two different official versions of that rule exist, and they disagree about whether you may trade with the bank off-turn.' + (isSea ? ' Seafarers adds one more restriction on top.' : '') + (s.ck ? ' Cities & Knights changes what an off-turn player may do with knights and progress cards.' : ''),\n      p56DeckNote: s.ck\n        ? (p78\n            ? 'Cities & Knights replaces the development deck outright, so every set\\u2019s development cards stay in the box \\u2014 see the Cities & Knights note below for what the second C&K box does and doesn\\u2019t add.'\n            : 'Cities & Knights replaces the development deck, so the extension\\u2019s 9 development cards stay in the box; add its 18 commodity cards to the matching stacks instead.')\n        : (p78\n            ? 'The development deck goes to 43: the 5\\u20136 deck\\u2019s 34 plus 6 Knight, 1 Road Building, 1 Year of Plenty and 1 Monopoly from the second base set \\u2014 leave that set\\u2019s Victory Point cards in the box, 5 is still right.'\n            : 'The extension\\u2019s 9 development cards \\u2014 6 Knight, 1 Road Building, 1 Year of Plenty, 1 Monopoly \\u2014 join the deck for 34 in all.'),\n      randomizeIslands: () => this.setState({ randomIsles: true, iSeed: Math.floor(Math.random() * 99991) + 1, revealed: {} }),\n      revealAll: () => this.setState(() => {\n        const r = {}; b.isles.forEach(c => { r[c[0] + '|' + c[1]] = true; }); return { revealed: r };\n      }),\n      hideAll: () => this.setState({ revealed: {} }),\n      rerollTerrain: () => this.setState({ tSeed: Math.floor(Math.random() * 99991) + 1, revealed: {} }),\n      rerollNumbers: () => this.setState({ nSeed: Math.floor(Math.random() * 99991) + 1, revealed: {} }),\n      rerollHarbors: () => this.setState({ hSeed: Math.floor(Math.random() * 99991) + 1, revealed: {} }),\n      rerollAll: () => this.setState({ tSeed: Math.floor(Math.random() * 99991) + 1, nSeed: Math.floor(Math.random() * 99991) + 1, hSeed: Math.floor(Math.random() * 99991) + 1, revealed: {} })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
